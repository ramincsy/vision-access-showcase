name: Showcase link check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local href/src targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          roots = [p for p in (Path("docs"), Path(".")) if p.exists()]
          html_files = []
          for root in roots:
            html_files.extend(root.rglob("*.html"))
          if not html_files:
            print("No HTML files found; skipping")
            sys.exit(0)
          missing = []
          for html in html_files:
            text = html.read_text(encoding="utf-8", errors="ignore")
            refs = re.findall(r'(?:href|src)=["\']([^"\'#]+)["\']', text, flags=re.I)
            for ref in refs:
              if ref.startswith(("http://", "https://", "mailto:", "data:", "//")):
                continue
              target = (html.parent / ref).resolve()
              try:
                target.relative_to(Path.cwd().resolve())
              except ValueError:
                continue
              if not target.exists():
                missing.append(f"{html}: {ref}")
          if missing:
            print("Broken local references:")
            print("\n".join(missing))
            sys.exit(1)
          print(f"OK — checked {len(html_files)} HTML file(s)")
          PY
